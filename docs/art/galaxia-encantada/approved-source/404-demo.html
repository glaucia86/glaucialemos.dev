<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Sinal perdido</title>
<style>
  html,body{margin:0;height:100%;background:#050204;color:#ffd9cf;font-family:"Courier New",monospace;overflow:hidden}
  .bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;z-index:0}
  .shade{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse at 30% 50%,rgba(0,0,0,.55),transparent 65%)}
  .content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 8vw;max-width:560px}
  h1{font-size:clamp(72px,14vw,160px);margin:0;line-height:1;letter-spacing:.05em;color:#ff4d3a;
     text-shadow:3px 0 #00e5ff,-3px 0 #ff2e63;animation:glitch 3.2s infinite steps(1)}
  p{font-size:clamp(14px,1.6vw,20px);line-height:1.6;margin:.8em 0 1.6em}
  a{align-self:flex-start;color:#050204;background:#ff4d3a;padding:.8em 1.4em;text-decoration:none;font-weight:bold;letter-spacing:.1em}
  a:hover{background:#ffd9cf}
  .som{position:fixed;right:16px;bottom:16px;z-index:3;background:rgba(0,0,0,.6);color:#ffd9cf;border:1px solid #ff4d3a;padding:.6em 1em;font:inherit;cursor:pointer}
  @keyframes glitch{0%,88%,100%{transform:none;text-shadow:3px 0 #00e5ff,-3px 0 #ff2e63}
    90%{transform:translate(-6px,2px);text-shadow:-8px 0 #00e5ff,8px 0 #ff2e63}
    94%{transform:translate(5px,-2px)}}
  @media (prefers-reduced-motion:reduce){h1{animation:none}}
</style>
</head>
<body>
  <video class="bg" autoplay muted loop playsinline preload="auto" poster="404-poster.jpg">
    <source src="404-loop.webm" type="video/webm">
    <source src="404-loop.mp4" type="video/mp4">
  </video>
  <div class="shade"></div>
  <main class="content">
    <h1>404</h1>
    <p>Sinal perdido. A página que você procurava foi sugada pelo vórtice.</p>
    <a href="/">VOLTAR PARA A BASE</a>
  </main>
  <button class="som" id="som">ATIVAR SOM</button>
  <audio id="aud" src="404-som.mp3" loop></audio>
  <script>
    const b=document.getElementById('som'),a=document.getElementById('aud');
    b.onclick=()=>{ if(a.paused){a.volume=.6;a.play();b.textContent='DESATIVAR SOM'}else{a.pause();b.textContent='ATIVAR SOM'} };
  </script>
</body>
</html>
